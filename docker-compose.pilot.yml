name: spravoshnik-epb-pilot

x-backend-common: &backend-common
  build:
    context: .
    dockerfile: Dockerfile.backend
  image: spravoshnik-epb-backend:pilot
  environment: &backend-environment
    APP_ENV: production
    APP_VERSION: ${APP_VERSION:-0.1.0}
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in deploy/pilot/.env.pilot}
    STORAGE_ROOT: /var/lib/spravoshnik/storage
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
    LOGIN_LOCKOUT_SECONDS: ${LOGIN_LOCKOUT_SECONDS:-900}
    SESSION_IDLE_TIMEOUT_SECONDS: ${SESSION_IDLE_TIMEOUT_SECONDS:-1800}
    SESSION_ABSOLUTE_TIMEOUT_SECONDS: ${SESSION_ABSOLUTE_TIMEOUT_SECONDS:-43200}
    WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS:-2}
    SCHEDULER_INTERVAL_SECONDS: ${SCHEDULER_INTERVAL_SECONDS:-60}
  volumes:
    - ./var/pilot/storage:/var/lib/spravoshnik/storage
  networks:
    - pilot

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spravoshnik}
      POSTGRES_DB: ${POSTGRES_DB:-spravoshnik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/pilot/.env.pilot}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - pilot_postgres_data:/var/lib/postgresql/data
    networks:
      - pilot

  migrate:
    <<: *backend-common
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    <<: *backend-common
    command: ["spravoshnik-api"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s

  worker:
    <<: *backend-common
    command: ["spravoshnik-worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    <<: *backend-common
    command: ["spravoshnik-scheduler"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: spravoshnik-epb-frontend:pilot
    restart: unless-stopped
    environment:
      NODE_ENV: production
      BACKEND_ORIGIN: http://backend:8000
      HOSTNAME: 0.0.0.0
      PORT: 3000
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${PILOT_HTTP_PORT:-3000}:3000"
    networks:
      - pilot

  backup:
    image: postgres:17-alpine
    profiles: ["maintenance"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spravoshnik}
      POSTGRES_DB: ${POSTGRES_DB:-spravoshnik}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in deploy/pilot/.env.pilot}
      APP_VERSION: ${APP_VERSION:-0.1.0}
    command: ["sh", "/scripts/backup.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./deploy/pilot/backup.sh:/scripts/backup.sh:ro
      - ./var/pilot/storage:/storage:ro
      - ./var/pilot/backups:/backups
    networks:
      - pilot

volumes:
  pilot_postgres_data:

networks:
  pilot:
    driver: bridge
