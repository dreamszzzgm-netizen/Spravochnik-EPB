services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spravoshnik
      POSTGRES_PASSWORD: spravoshnik
      POSTGRES_DB: spravoshnik
    ports:
      - "5432:5432"
    volumes:
      - spravoshnik_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spravoshnik -d spravoshnik"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: spravoshnik
      POSTGRES_PASSWORD: spravoshnik
      POSTGRES_DB: spravoshnik_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spravoshnik -d spravoshnik_test"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  spravoshnik_pgdata:
