name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spravoshnik
          POSTGRES_PASSWORD: spravoshnik
          POSTGRES_DB: spravoshnik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spravoshnik -d spravoshnik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://spravoshnik:spravoshnik@localhost:5432/spravoshnik_test
      TEST_DATABASE_URL: postgresql+psycopg://spravoshnik:spravoshnik@localhost:5432/spravoshnik_test
      STORAGE_ROOT: ./var/test-storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests --output-format=github
      - run: alembic upgrade head
      - run: >-
          pytest --confcutdir=tests/integration
          tests/integration/test_universal_documents_migration.py -q
