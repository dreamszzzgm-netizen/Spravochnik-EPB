name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spravoshnik
          POSTGRES_PASSWORD: spravoshnik
          POSTGRES_DB: spravoshnik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spravoshnik -d spravoshnik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://spravoshnik:spravoshnik@localhost:5432/spravoshnik_test
      TEST_DATABASE_URL: postgresql+psycopg://spravoshnik:spravoshnik@localhost:5432/spravoshnik_test
      STORAGE_ROOT: ./var/test-storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests
      - name: Verify single Alembic head
        shell: bash
        run: |
          heads=$(alembic heads)
          echo "$heads"
          test "$(printf '%s\n' "$heads" | wc -l)" -eq 1
          printf '%s\n' "$heads" | grep -q '^0021_universal_documents '
      - run: alembic upgrade head
      - name: Run full pytest to first failure
        shell: bash
        run: |
          set +e
          pytest -x --tb=short 2>&1 | tee /tmp/pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            message=$(tail -n 100 /tmp/pytest.log)
            message=${message//'%'/'%25'}
            message=${message//$'\r'/'%0D'}
            message=${message//$'\n'/'%0A'}
            echo "::error title=Full pytest first failure::$message"
          fi
          exit "$status"
