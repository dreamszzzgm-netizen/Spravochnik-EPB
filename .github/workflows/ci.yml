name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: spravoshnik
          POSTGRES_PASSWORD: spravoshnik
          POSTGRES_DB: spravoshnik_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spravoshnik -d spravoshnik_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://spravoshnik:spravoshnik@localhost:5432/spravoshnik_test
      TEST_DATABASE_URL: postgresql+psycopg://spravoshnik:spravoshnik@localhost:5432/spravoshnik_test
      STORAGE_ROOT: ./var/test-storage

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check app tests --output-format=github
      - run: alembic upgrade head
      - name: Run focused repository test with diagnostics
        shell: bash
        run: |
          set +e
          pytest --confcutdir=tests/integration tests/integration/test_universal_document_repository.py -q 2>&1 | tee /tmp/pytest.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            tail -n 80 /tmp/pytest.log | while IFS= read -r line; do
              safe=${line//'%'/'%25'}
              safe=${safe//$'\r'/'%0D'}
              safe=${safe//$'\n'/'%0A'}
              echo "::error::$safe"
            done
          fi
          exit "$status"
