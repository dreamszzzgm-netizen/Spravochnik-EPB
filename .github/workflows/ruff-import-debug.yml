name: ruff-import-debug

on:
  push:
    branches:
      - agent/stage4-cp41-contracts-core

jobs:
  show-fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff==0.15.22"
      - name: Show Ruff import fix
        run: |
          ruff check --fix tests/integration/test_contracts_core.py || true
          git diff -- tests/integration/test_contracts_core.py
